openapi: 3.1.0
info:
  title: Calendar API
  version: 2.0.0
  description: |
    REST contract between the calendar component (`restDataSource`) and a backend.
    The test backend (`TestBE`) is the reference implementation.

    - Authentication uses an HttpOnly session cookie set by the backend. Alternatively a host can send
      `Authorization: Bearer …` (`restDataSource({ getAccessToken })`).
    - Changing requests must use `Content-Type: application/json`.
    - Every request carries `Accept-Language` with the current language of the component. Mails use the
      recipient's stored `locale`, otherwise this header, otherwise English.
    - Errors are `Problem` objects. The component translates known `code` values itself and otherwise shows `message`.

    **What a backend needs.** Every operation carries `x-feature`. `core` is needed as soon as the component talks to
    a backend (`storageMode: remote` or the `auth` feature). Every other value is only needed when that feature is on
    (see the feature table in the Developer Guide): with `features: { chat: false }` the chat endpoints are never
    called. `getUserToken` is only needed for sign-in through the host page, `tenant` only for a tenant backend.

    **Public tenant service.** The following sections (tenants, host tokens, sessions, protection on every request)
    are binding for the public multi-tenant service that `tenantDataSource` talks to. A self-hosted backend may follow
    them as recommendations; it only has to answer each endpoint as described below, and may use its own token format
    for `POST /auth/token`.

    **Tenants** (public multi-tenant backend, `tenantDataSource`): every request carries the header
    `X-Calendar-Tenant: <public tenant id>`. A backend with exactly one tenant may ignore it. A multi-tenant backend
    answers `403` with `unknownTenant` for an unknown or suspended id and `403` with `originNotAllowed` when `Origin` is
    not in the tenant's allowed origins. The tenant id is public; it never proves anything on its own.

    **Host token sign-in** (`getUserToken`): when `GET /auth/me` answers `401`, the component asks the host page for a
    token and exchanges it at `POST /auth/token` for a session. The same happens when any request answers `401` later.
    Password endpoints are not used in this mode. The token is a JWT that the host's server signs; the private key
    never leaves the host's server. The backend accepts it only if all of these hold, and otherwise answers `401`
    `invalidUserToken` without saying which check failed:

    | Part | Rule |
    | --- | --- |
    | `alg` | `ES256`, `EdDSA` or `RS256` (at least 2048 bit). Never `none` or a shared secret (`HS*`) |
    | `kid` | Id of an active, not revoked, not expired key of this tenant; `alg` must match that key |
    | `iss` | The public tenant id, equal to `X-Calendar-Tenant` |
    | `aud` | `rokoyfa-calendar` |
    | `sub` | Stable user id at the host, at most 255 characters |
    | `iat`, `exp` | `exp` at most 300 seconds after `iat`, `iat` not in the future; 30 seconds clock skew at most |
    | `jti` | Random, at least 16 characters. Each `jti` is accepted once per tenant (store it until `exp`) |
    | `email`, `name` | The user's address and name at the host; they update the account on every sign-in. The address is not taken as confirmed: the backend sends a confirmation link to a new or changed address, and until it is confirmed `GET /invitations` returns nothing and accepting an invitation answers `403` `emailNotVerified` |

    **Sessions.**
    - The session is a random value of at least 256 bits in an `HttpOnly; Secure; SameSite=None` cookie with the
      `__Host-` prefix. Only its hash is stored.
    - A new session is created on every sign-in; any session sent along is ended.
    - A session from a host token ends after 30 minutes without use and after 12 hours at the latest; the component
      then signs in again by itself. A password session ends after 7 days without use and after 30 days at the latest.
    - A session belongs to the tenant it was created in. A request whose session belongs to another tenant than
      `X-Calendar-Tenant` gets `401` as if there were no session.

    **Protection on every request.**
    - Every query is limited to the tenant of the request and to what the user may see. Items of other tenants or
      without access answer `404` (never `403`), so ids cannot be probed.
    - Requests that change something (`POST`, `PUT`, `PATCH`, `DELETE`) with a session cookie need an `Origin` header
      from the tenant's allowed origins, otherwise `403` `originNotAllowed`. Together with `Content-Type:
      application/json` this blocks cross-site request forgery.
    - The WebSocket (`/chat/socket`) checks `Origin`, the session and its tenant on connect, and closes when the
      session ends.
    - CORS headers are only sent for allowed origins. CORS only limits browsers; it is not access control.
    - `POST /auth/token`, `POST /auth/login`, `POST /auth/register` and the password reset are rate limited per
      tenant, IP address and account (`429`).
    - Links in emails, public links and feed addresses carry random tokens of at least 256 bits. Only their hash is
      used for look-ups.
    - Attachments are only served after a malware scan, by the backend itself (never through a direct storage
      address), with `Content-Disposition: attachment` and `X-Content-Type-Options: nosniff`.
    - Responses carry `Cache-Control: no-store`, except `GET /tenant/config` and feeds.

    **Versioning.** This is version 2 of the contract. Serve it under a versioned base path such as `/api/v2` and set
    the component's `apiBaseUrl` (`api-base-url`) to it; a later major version can then run next to it. Changes within
    a major version only add endpoints, fields or optional parameters.

    **Two-factor sign-in** (`twoFactor`): accounts with a password can turn on codes from an authenticator app. The
    page for this is part of the component (`#calendar-security` opens it, see the Developer Guide), so a backend only
    needs the endpoints. The confirmation mail after registration links to that page. Secrets are stored encrypted,
    recovery codes and the sign-in challenge only as hashes. A used code (its 30-second step) is not accepted again.

    **Rate limits.** Any endpoint may answer `429` with a `Retry-After` header (seconds or HTTP date). Send `code`
    `rateLimited`, or a more specific one. The component then shows how long to wait. Cross-origin backends must list
    `Retry-After` in `Access-Control-Expose-Headers`, otherwise the browser hides it.

    **Error codes.** Every error is a `Problem` with one of these codes. The component translates them, except
    `invalidInput`, `invalidJson`, `unsupportedMediaType`, `emptyFile`, `routeNotFound` and `methodNotAllowed`: for these
    and for unknown codes it shows `message`, so write it in plain English.

    | Code | Status | When |
    | --- | --- | --- |
    | `invalidInput` | 400 | The body or a parameter is invalid. `message` says what |
    | `invalidJson` | 400 | The body is not a JSON object |
    | `unsupportedMediaType` | 415 | A changing request without `Content-Type: application/json` |
    | `selfInvite` | 400 | The own address is in the invitations |
    | `emptyFile` | 400 | An uploaded file is empty |
    | `unauthorized` | 401 | No valid session or token |
    | `invalidCredentials` | 401 | Email or password is wrong on sign-in |
    | `invalidUserToken` | 401 | The host token for `POST /auth/token` is invalid or expired |
    | `invalidTwoFactorCode` | 400 | The code or recovery code is wrong or was used already |
    | `invalidCalendarUrl` | 400 | The address of an external calendar is not usable |
    | `caldavAuthFailed` | 400 | The other CalDAV server refused user name or password |
    | `forbidden` | 403 | The role does not allow this |
    | `wrongPassword` | 403 | The password confirming a change is wrong |
    | `wrongCurrentPassword` | 403 | The current password is wrong when changing it |
    | `unknownTenant` | 403 | `X-Calendar-Tenant` names no known tenant |
    | `emailNotVerified` | 403 | The email address must be confirmed first (accepting an invitation) |
    | `featureDisabled` | 403 | The tenant turned the feature off (`registration`, `attachments`, `publicLinks`, `subscriptions`, `dataExport`, …) |
    | `originNotAllowed` | 403 | `Origin` is not allowed for the tenant |
    | `routeNotFound` | 404 | The path does not exist |
    | `methodNotAllowed` | 405 | The method is not allowed on this path |
    | `notFound` | 404 | Generic: the item does not exist or is not visible |
    | `eventNotFound` | 404 | The event does not exist, is not visible or is in the trash |
    | `calendarNotFound` | 404 | The calendar does not exist or is not visible |
    | `teamNotFound` | 404 | The team does not exist or is not visible |
    | `memberNotFound` | 404 | The member does not exist |
    | `invitationNotFound` | 404 | The invitation does not exist |
    | `categoryNotFound` | 404 | The category does not exist |
    | `attachmentNotFound` | 404 | The attachment does not exist |
    | `shareNotFound` | 404 | The public link is unknown or turned off |
    | `emailTaken` | 409 | An account with this email exists |
    | `alreadyMember` | 409 | The invited person is already a member |
    | `alreadyInvited` | 409 | The address is already invited |
    | `alreadyOwner` | 409 | The member is already an owner |
    | `personalTeam` | 409 | Not possible for the personal calendar |
    | `lastOwner` | 409 | The last owner cannot leave or be demoted |
    | `lastCalendar` | 409 | The last calendar of a team cannot be deleted |
    | `soleOwner` | 409 | The account owns a team with other members |
    | `seriesHasDetached` | 409 | The repetition is removed while detached events exist |
    | `seriesDeleted` | 409 | A detached event is restored while its series is in the trash |
    | `tooManyColors` | 409 | More than 12 custom colors |
    | `categoryExists` | 409 | A category with this name exists in the calendar |
    | `uidTaken` | 409 | Another event in the calendar already has this `uid` |
    | `tenantLimitReached` | 409 | The tenant reached its limit of users, teams or attachment storage |
    | `tooManyCategories` | 409 | More than 30 categories in a calendar |
    | `tooManyAttachments` | 409 | More than 20 attachments on an event |
    | `twoFactorAlreadyEnabled` | 409 | The two-factor sign-in is already on |
    | `twoFactorNotEnabled` | 409 | The two-factor sign-in is off, or no setup was started |
    | `alreadySubscribed` | 409 | The external calendar is already subscribed |
    | `tooManyExternalCalendars` | 409 | More than 10 external calendars |
    | `tooManyAppPasswords` | 409 | More than 20 app passwords |
    | `tooManyCaldavAccounts` | 409 | More than 5 CalDAV accounts |
    | `twoFactorExpired` | 410 | The sign-in step for the code expired; sign in again |
    | `invalidLink` | 410 | The link from an email is invalid or expired |
    | `invitationExpired` | 410 | The invitation is no longer valid |
    | `eventChanged` | 412 | `If-Match` names an older `version` of the event |
    | `payloadTooLarge` | 413 | The body is too large |
    | `attachmentTooLarge` | 413 | The file is larger than 10 MB |
    | `tooManyLoginAttempts` | 429 | Too many failed sign-ins, with `Retry-After` |
    | `rateLimited` | 429 | Any other rate limit, with `Retry-After` |
    | `serverError` | 500 | Unexpected error |
    | `externalCalendarUnavailable` | 502 | The external calendar could not be loaded |
servers:
  - url: /api/v2
    description: Recommended, with `apiBaseUrl` set to it
  - url: /api
    description: Default of the component
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Auth
  - name: Events
  - name: Calendars
  - name: Teams
  - name: Invitations
  - name: Preferences
  - name: Chat
    description: |
      One chat per event in team calendars, for recurring events one per occurrence (`date` = original date of the occurrence).
      Live updates come over a WebSocket at `{base}/chat/socket`, see the Developer Guide section “Event chat”.
      The same WebSocket carries `{ type: 'event.changed', calendarId, eventId, version, changedBy }` after every change
      to an event (`version` is `null` when it was deleted), see the Developer Guide section “Live updates”.
  - name: Tenant
    description: Settings that the host sets for its tenant, for example in an admin dashboard.
  - name: Holidays
  - name: Trash
    description: Deleted events stay in the trash of their calendar for 30 days and can be restored.
  - name: Categories
    description: Categories belong to one calendar. Events carry their ids in `categoryIds`.
  - name: Attachments
    description: Files on events. Only for members of the event's calendar, never through public links or subscriptions.
  - name: Sharing
    description: Public read-only links to a calendar. The `/shared` paths need no session.
  - name: CalDAV
    description: |
      The calendars as CalDAV server for other programs. This part only manages app passwords; the protocol under
      `/dav/` is described in `api/caldav.md`.
  - name: CalDAV accounts
    description: CalDAV accounts of other services (Nextcloud, iCloud …), shown and edited next to the own calendars.
  - name: External calendars
    description: Read-only calendars from other services (`.ics` addresses), shown next to the own calendars.
  - name: Notifications
    description: |
      In-app notifications (bell). New notifications also arrive over the WebSocket as
      `{ type: 'notification.created', notification }`.
paths:
  /auth/me/export:
    get:
      tags: [Auth]
      x-feature: dataExport
      summary: Download the own data (GDPR Art. 20)
      description: |
        Everything stored for the signed-in user as one JSON file: profile, preferences, colors, memberships,
        calendars, the categories of the personal calendar, the events of the personal calendar and those the user
        created elsewhere (also in the trash), own reminders on other events, attendee responses, own chat messages
        and the details of own attachments (without their content). Never password hashes, sessions or tokens,
        and no events or messages of other people. Served with `Content-Disposition: attachment`.
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExport' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [Auth]
      x-feature: auth
      summary: Current user
      security: []
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Auth]
      x-feature: auth
      summary: Change name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/PersonName' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Auth]
      x-feature: auth
      summary: Delete account
      description: Deletes the account, sessions, preferences, the personal team and teams the user was alone in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: 'Deleted, session cookie cleared' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/me/password:
    post:
      tags: [Auth]
      x-feature: auth
      summary: Change password
      description: Ends all other sessions of the user and revokes all app passwords. `403` with `wrongCurrentPassword`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [Auth]
      x-feature: registration
      summary: Register
      description: |
        Creates the account with a personal team and calendar, starts a session and sends a confirmation link.
        `409` with `emailTaken`. `403` with `featureDisabled` when the tenant turned `registration` off.
        `409` with `tenantLimitReached` when the tenant has no room for another user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { $ref: '#/components/schemas/PersonName' }
                email: { $ref: '#/components/schemas/Email' }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '201': { $ref: '#/components/responses/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Auth]
      x-feature: auth
      summary: Sign in
      description: |
        `401` with `invalidCredentials`, `429` with `tooManyLoginAttempts` after 5 failures in 15 minutes.
        When the account has the two-factor sign-in turned on, the answer is `202` with a `challenge` and no session
        yet; the component then asks for the code and calls `POST /auth/login/two-factor`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '202':
          description: Password correct, the second factor is missing
          content:
            application/json:
              schema:
                type: object
                required: [twoFactorRequired, challenge]
                properties:
                  twoFactorRequired: { type: boolean, const: true }
                  challenge: { type: string, description: 'Random value, valid for 10 minutes and 5 attempts' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/token:
    post:
      tags: [Auth]
      x-feature: getUserToken
      summary: Sign in with a token issued by the host page
      description: |
        Checks the token as described under "Host token sign-in", creates the user on first use (linked to `sub`) and
        starts a new session. `401` with `invalidUserToken` for any failed check, `403` with `unknownTenant` or
        `originNotAllowed`.
        `409` with `tenantLimitReached` when a new account would exceed the user limit of the tenant.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: JWT signed by the host's server with an asymmetric key of the tenant }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      x-feature: auth
      summary: Sign out
      security: []
      responses:
        '204': { description: 'Session ended, cookie cleared' }
  /auth/password-reset:
    post:
      tags: [Auth]
      x-feature: auth
      summary: Request a password reset link
      description: Always answers 204, also for unknown addresses. The link is valid for one hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: '#/components/schemas/Email' }
      responses:
        '204': { description: Accepted }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      x-feature: auth
      summary: Set a new password with a reset token
      description: Ends all sessions and revokes all app passwords. `410` with `invalidLink`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204': { description: Changed }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/verify-email:
    post:
      tags: [Auth]
      x-feature: auth
      summary: Confirm the email address
      description: '`410` with `invalidLink`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Confirmed }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/verify-email/resend:
    post:
      tags: [Auth]
      x-feature: auth
      summary: Send a new confirmation link
      responses:
        '204': { description: Sent }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/login/two-factor:
    post:
      tags: [Auth]
      x-feature: twoFactor
      summary: Second step of the sign-in
      description: |
        Finishes a sign-in that `POST /auth/login` answered with `202`. Send either `code` (6 digits from the
        authenticator app) or `recoveryCode`. A code is accepted once; a recovery code is used up.
        `400` with `invalidTwoFactorCode`. After 5 wrong codes, or 10 minutes after the password step, the challenge is
        void and the answer is `410` with `twoFactorExpired`; the component then starts again with the password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: { type: string, description: Value from the `202` answer of `POST /auth/login` }
                code: { type: string, pattern: '^\d{6}$' }
                recoveryCode: { type: string, maxLength: 32 }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/two-factor:
    get:
      tags: [Auth]
      x-feature: twoFactor
      summary: State of the two-factor sign-in
      responses:
        '200':
          description: State
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorState' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Auth]
      x-feature: twoFactor
      summary: Turn the two-factor sign-in off
      description: |
        Needs the password and a current code or an unused recovery code. Removes the secret and all recovery codes.
        `403` with `wrongPassword`, `400` with `invalidTwoFactorCode`, `409` with `twoFactorNotEnabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
                recoveryCode: { type: string, maxLength: 32 }
      responses:
        '204': { description: Turned off }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/two-factor/setup:
    post:
      tags: [Auth]
      x-feature: twoFactor
      summary: Start the setup
      description: |
        Creates a new secret (TOTP, RFC 6238: SHA-1, 6 digits, 30 seconds) that is not active yet. A setup that was not
        confirmed is replaced. Only for accounts with a password; accounts signed in through the host page get `403`
        `forbidden`, the host protects their sign-in. `403` with `wrongPassword`, `409` with `twoFactorAlreadyEnabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Secret for the authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri]
                properties:
                  secret: { type: string, description: 'Base32, for typing it in by hand' }
                  otpauthUri: { type: string, description: '`otpauth://totp/…` for the QR code' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/two-factor/confirm:
    post:
      tags: [Auth]
      x-feature: twoFactor
      summary: Turn the two-factor sign-in on
      description: |
        Checks the first code from the app, turns the two-factor sign-in on, ends all other sessions of the user and
        returns 10 recovery codes. They are shown once; only their hash is stored. `400` with `invalidTwoFactorCode`,
        `409` with `twoFactorNotEnabled` when no setup was started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryCodes' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/two-factor/recovery-codes:
    post:
      tags: [Auth]
      x-feature: twoFactor
      summary: New recovery codes
      description: Replaces all recovery codes. `403` with `wrongPassword`, `409` with `twoFactorNotEnabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/sessions:
    get:
      tags: [Auth]
      x-feature: auth
      summary: Signed-in devices
      description: All active sessions of the user, newest use first.
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Auth]
      x-feature: auth
      summary: Sign out all other devices
      description: Ends every session of the user except the current one.
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Auth]
      x-feature: auth
      summary: Sign out one device
      description: Ending the current session also clears the cookie. `404` with `notFound`.
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /events:
    get:
      tags: [Events]
      x-feature: core
      summary: List events
      description: |
        Either `from`, `to` and at least one `calendarId` (events in the range and all series that can occur in it),
        or `seriesId` (the series and its detached events).
      parameters:
        - { name: from, in: query, schema: { $ref: '#/components/schemas/ISODate' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/ISODate' } }
        - name: calendarId
          in: query
          description: Repeatable. `personal` stands for the own personal calendar.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - { name: seriesId, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Events
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Events]
      x-feature: core
      summary: Create an event
      description: |
        Needs `create_entry`.
        `409` with `uidTaken` when another event of the calendar has the same `uid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EventInput'
                - type: object
                  required: [calendarId]
                  properties:
                    calendarId: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201': { $ref: '#/components/responses/Event' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/search:
    get:
      tags: [Events]
      x-feature: search
      summary: Search events
      description: |
        Events and series whose title, location, description or links contain `q` (case-insensitive), in the given calendars.
        Optional for custom backends: without it the component searches the events of the last and next year itself.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - name: calendarId
          in: query
          required: true
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Matching events, at most 50
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
        '400': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/response:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Events]
      x-feature: attendees
      summary: Answer an event invitation
      description: Sets the status of the attendee whose email is the signed-in user's. Allowed for every attendee with read access. `403` if the user is not an attendee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/AttendeeStatus' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Event' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/move:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Events]
      summary: Move an event to another calendar
      description: |
        Moves a single event or a whole series with its detached events. Needs the right to delete the event in its
        calendar and `create_entry` in the target. Categories are removed because they belong to the old calendar;
        attachments, chat and history stay with the event. `400` for a detached event, `409` with `uidTaken` when the
        target already has the `uid`, `412` with `eventChanged` when `If-Match` names an older `version`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendarId]
              properties:
                calendarId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Event' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/reminders:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Events]
      x-feature: reminders
      summary: Set the own reminders of an event
      description: Changes only the reminders of the signed-in user. Allowed with read access, so members without edit rights can be reminded too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reminders]
              properties:
                reminders: { type: array, maxItems: 5, items: { type: integer, minimum: 0, maximum: 40320 } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Event' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /events/email-response:
    post:
      tags: [Events]
      x-feature: attendees
      summary: Answer an invitation from an email link
      description: No session needed. The token comes from the invitation email (`/respond?status=…&token=…` on the host page) and stands for one attendee of one event.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, status]
              properties:
                token: { type: string }
                status: { type: string, enum: [accepted, tentative, declined] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /events/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Events]
      x-feature: core
      summary: Replace an event
      description: |
        The calendar stays the same. Needs `update_any_entry` or, for own events, `update_own_entry`.
        `409` with `seriesHasDetached` when the recurrence is removed while detached events exist.
        `412` with `eventChanged` when `If-Match` names an older `version`. The response carries the new `version`.
        `409` with `uidTaken` when the new `uid` belongs to another event of the calendar.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Event' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Events]
      x-feature: core
      summary: Delete an event
      description: |
        Moves the event, and the detached events of a series, to the trash of its calendar. They can be restored
        for 30 days, then they are deleted for good with their attachments and chat.
        Needs `delete_any_entry` or, for own events, `delete_own_entry`.
        `412` with `eventChanged` when `If-Match` names an older `version`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /calendars/{calendarId}/trash:
    parameters:
      - $ref: '#/components/parameters/CalendarId'
    get:
      tags: [Trash]
      x-feature: trash
      summary: Deleted events of a calendar
      description: |
        Newest first, one entry per deletion. Detached events deleted together with their series are not listed on
        their own but counted in `detachedCount`. Entries older than 30 days are deleted for good and no longer listed.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Deleted events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrashedEvent' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Trash]
      x-feature: trash
      summary: Empty the trash of a calendar
      description: |
        Deletes for good every entry the user may delete (all with `delete_any_entry`, own ones with
        `delete_own_entry`), with detached events, attachments and chat. Other entries stay.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Number of deleted entries
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/restore:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Trash]
      x-feature: trash
      summary: Restore an event from the trash
      description: |
        Restores the event with the same id, its attachments and chat, together with the detached events deleted with it.
        `version` goes up by one. Needs the right to delete the event.
        `409` with `seriesDeleted` when the event is a detached occurrence whose series is still in the trash.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Event' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /calendars/{calendarId}/trash/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { name: eventId, in: path, required: true, description: 'Id of the deleted event', schema: { type: string } }
    delete:
      tags: [Trash]
      x-feature: trash
      summary: Delete an event for good
      description: Removes it from the trash with its detached events, attachments and chat. Needs the right to delete the event.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Deleted for good }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /calendars:
    get:
      tags: [Calendars]
      x-feature: core
      summary: Calendars of the user
      description: Personal calendar first, then team calendars by team name.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/CalendarSummaries' }
    post:
      tags: [Calendars]
      x-feature: teams
      summary: Create a team with its first calendar
      description: |
        The caller becomes owner. `400` with `selfInvite` when the own address is in `invitations`.
        `409` with `tenantLimitReached` when the tenant has no room for another team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/CalendarName' }
                description: { $ref: '#/components/schemas/Description' }
                color: { $ref: '#/components/schemas/EventColor' }
                invitations:
                  type: array
                  maxItems: 50
                  items: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201': { $ref: '#/components/responses/CalendarSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/chat:
    parameters:
      - { name: eventId, in: path, required: true, description: 'Event id, for detached occurrences the id of their series', schema: { type: string } }
      - { name: date, in: query, required: false, description: 'Required for recurring events: the original date of the occurrence. Not allowed for single events.', schema: { $ref: '#/components/schemas/ISODate' } }
    get:
      tags: [Chat]
      x-feature: chat
      summary: Messages of an event chat
      description: Oldest first. Without `before` the newest page. Every member of the team calendar may read. `400` with `personalTeam` in personal calendars.
      parameters:
        - { name: before, in: query, required: false, description: 'Message id, returns messages older than this one', schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Page of messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Chat]
      x-feature: chat
      summary: Write a message
      description: Every member of the team calendar may write. Marks the chat as read for the author, sends `message.created` over the socket to all members and an email to attendees who want it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/chat/read:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
      - { name: date, in: query, required: false, schema: { $ref: '#/components/schemas/ISODate' } }
    post:
      tags: [Chat]
      x-feature: chat
      summary: Mark the chat as read
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Marked }
  /chat/messages/{messageId}:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Chat]
      x-feature: chat
      summary: Edit an own message
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Edited, `editedAt` is set. Sends `message.updated` over the socket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Chat]
      x-feature: chat
      summary: Delete a message
      description: Own messages, or any message with `manage_calendars` (owner, admin, manager). Sends `message.deleted` over the socket.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /chat/unread:
    get:
      tags: [Chat]
      x-feature: chat
      summary: Unread messages per chat
      description: Messages of others newer than the user's last read time, only chats with at least one.
      parameters:
        - name: calendarId
          in: query
          required: true
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Counts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChatUnread' } }
  /calendars/{calendarId}/feed:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Calendars]
      x-feature: subscriptions
      summary: Own subscription link
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Link or null
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { oneOf: [{ type: string, format: uri }, { type: 'null' }] } } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Calendars]
      x-feature: subscriptions
      summary: Create a new subscription link
      description: Replaces an existing link of this user for this calendar.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201':
          description: New link
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Calendars]
      x-feature: subscriptions
      summary: End the subscription
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Ended }
  /feeds/{token}.ics:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Calendars]
      x-feature: subscriptions
      summary: Calendar subscription
      description: No session needed. The calendar as iCalendar with the subscriber's own reminders as alarms and the category names as `CATEGORIES`. `404` when the token is unknown or the user is no longer a member.
      security: []
      responses:
        '200':
          description: iCalendar
          content:
            text/calendar:
              schema: { type: string }
        '404': { description: Unknown link }
  /calendars/{calendarId}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    patch:
      tags: [Calendars]
      x-feature: core
      summary: Change name or color
      description: Needs `manage_calendars`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { $ref: '#/components/schemas/CalendarName' }
                color: { $ref: '#/components/schemas/EventColor' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/CalendarSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Calendars]
      x-feature: teams
      summary: Delete a calendar of a team
      description: Needs `manage_calendars`. `409` with `lastCalendar` for the last calendar of a team.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Deleted with its events }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /calendars/{calendarId}/display:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    put:
      tags: [Calendars]
      x-feature: teams
      summary: Personal display settings for a team calendar
      description: '`409` with `personalTeam` for the personal calendar.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showInPersonal]
              properties:
                showInPersonal: { type: boolean }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/CalendarSummary' }
        '409': { $ref: '#/components/responses/Problem' }
  /teams/{teamId}:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    patch:
      tags: [Teams]
      x-feature: teams
      summary: Change team name or description
      description: Needs `manage_team`. `409` with `personalTeam`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { $ref: '#/components/schemas/CalendarName' }
                description: { $ref: '#/components/schemas/Description' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/CalendarSummaries' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Teams]
      x-feature: teams
      summary: Delete a team
      description: Needs `delete_team`. Deletes calendars, events and invitations. `409` with `personalTeam`.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /teams/{teamId}/calendars:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    post:
      tags: [Teams]
      x-feature: teams
      summary: Add a calendar to a team
      description: Needs `manage_calendars`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/CalendarName' }
                color: { $ref: '#/components/schemas/EventColor' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201': { $ref: '#/components/responses/CalendarSummary' }
        '403': { $ref: '#/components/responses/Problem' }
  /teams/{teamId}/membership:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    delete:
      tags: [Teams]
      x-feature: teams
      summary: Leave a team
      description: '`409` with `personalTeam` or `lastOwner`.'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Left }
        '409': { $ref: '#/components/responses/Problem' }
  /teams/{teamId}/transfer-ownership:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    post:
      tags: [Teams]
      x-feature: teams
      summary: Make another member owner
      description: |
        Only for owners. The new owner gets `owner`, the caller becomes `admin`.
        `400` with `alreadyOwner` for the caller itself, `409` with `alreadyOwner` for another owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/CalendarSummaries' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /teams/{teamId}/members:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    get:
      tags: [Teams]
      x-feature: teams
      summary: Members of a team
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Members
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
  /teams/{teamId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Teams]
      x-feature: teams
      summary: Change a member's role
      description: Needs `manage_members` and a role above the target and the new role. `409` with `lastOwner`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/TeamRole' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Teams]
      x-feature: teams
      summary: Remove a member
      description: Members can remove themselves. `409` with `lastOwner`.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /teams/{teamId}/invitations:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    get:
      tags: [Invitations]
      x-feature: teams
      summary: Open invitations of a team
      description: Needs `invite_members`.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Invitations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamInvitation' } }
    post:
      tags: [Invitations]
      x-feature: teams
      summary: Invite by email
      description: |
        Needs `invite_members` and a role above the invited role. Valid for 7 days.
        `409` with `selfInvite`, `alreadyMember`, `alreadyInvited` or `personalTeam`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201':
          description: Invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamInvitation' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /teams/{teamId}/invitations/{invitationId}:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
      - { $ref: '#/components/parameters/InvitationId' }
    delete:
      tags: [Invitations]
      x-feature: teams
      summary: Withdraw an invitation
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Withdrawn }
        '403': { $ref: '#/components/responses/Problem' }
  /invitations:
    get:
      tags: [Invitations]
      x-feature: teams
      summary: Open invitations to the own email address
      description: |
        Empty while the own email address is not confirmed.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Invitations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PendingInvitation' } }
  /invitations/accept:
    post:
      tags: [Invitations]
      x-feature: teams
      summary: Accept an invitation with the token from the mail
      description: |
        '`410` with `invitationExpired`.'
        `403` with `emailNotVerified` while the own email address is not confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/CalendarSummaries' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /invitations/{invitationId}/accept:
    parameters:
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Invitations]
      x-feature: teams
      summary: Accept an invitation
      description: |
        '`409` with `alreadyMember`, `410` with `invitationExpired`.'
        `403` with `emailNotVerified` while the own email address is not confirmed.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/CalendarSummaries' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /invitations/{invitationId}/decline:
    parameters:
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Invitations]
      x-feature: teams
      summary: Decline an invitation
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Declined }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/history:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Events]
      x-feature: history
      summary: Change history of an event
      description: |
        Who changed what and when, newest first, for everyone who can see the event. One entry per request; changes
        to attendees, links, categories and the repetition are listed by name without values. Entries are kept for a
        year. `404` with `eventNotFound`.
      parameters:
        - { name: before, in: query, required: false, schema: { type: string }, description: '`id` of the oldest entry already loaded' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, hasMore]
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
                  hasMore: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /external-calendars:
    get:
      tags: [External calendars]
      x-feature: externalCalendars
      summary: Subscribed external calendars
      responses:
        '200':
          description: External calendars
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExternalCalendar' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [External calendars]
      x-feature: externalCalendars
      summary: Subscribe to an external calendar
      description: |
        The backend loads the address once to check it. `400` with `invalidCalendarUrl` when it is not an `https://`
        (or `webcal://`) address, points to a private network, or does not return a calendar. `409` with
        `alreadySubscribed` or `tooManyExternalCalendars` (10 per user). `502` with `externalCalendarUnavailable` when
        the address cannot be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalCalendarInput' }
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalCalendar' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /external-calendars/{externalCalendarId}:
    parameters:
      - { name: externalCalendarId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [External calendars]
      x-feature: externalCalendars
      summary: Change an external calendar
      description: A new `url` is checked like on creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/CalendarName' }
                url: { type: string, maxLength: 2000 }
                color: { $ref: '#/components/schemas/EventColor' }
                shown: { type: boolean }
                position: { type: integer, minimum: 0, maximum: 255 }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalCalendar' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [External calendars]
      x-feature: externalCalendars
      summary: Unsubscribe
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /external-calendars/{externalCalendarId}/ics:
    parameters:
      - { name: externalCalendarId, in: path, required: true, schema: { type: string } }
    get:
      tags: [External calendars]
      x-feature: externalCalendars
      summary: Content of an external calendar
      description: |
        The iCalendar file as the source delivers it. The backend loads it at most every 15 minutes and otherwise
        answers from its copy; the component reads it like an import and shows the events read-only.
        `502` with `externalCalendarUnavailable` when the source cannot be reached and there is no copy yet.
      responses:
        '200':
          description: iCalendar
          content:
            text/calendar:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /auth/app-passwords:
    get:
      tags: [CalDAV]
      x-feature: caldav
      summary: App passwords for CalDAV programs
      description: Name, creation and last use of every app password of the user, newest first. The password itself is never sent again.
      responses:
        '200':
          description: App passwords
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AppPassword' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [CalDAV]
      x-feature: caldav
      summary: Create an app password
      description: |
        Creates a random password for one CalDAV program (Apple Calendar, Thunderbird, DAVx5 …). It is returned once
        and stored only as a hash. CalDAV accepts only app passwords, never the account password, so the two-factor
        sign-in stays effective. `409` with `tooManyAppPasswords` (20 per user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Created, with the password
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AppPassword' }
                  - type: object
                    required: [password]
                    properties:
                      password: { type: string, description: Shown once }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/app-passwords/{appPasswordId}:
    parameters:
      - { name: appPasswordId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [CalDAV]
      x-feature: caldav
      summary: Revoke an app password
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /caldav:
    get:
      tags: [CalDAV]
      x-feature: caldav
      summary: Access data for CalDAV programs
      description: The server address and user name to enter in a CalDAV program. The protocol itself is described in `api/caldav.md`.
      responses:
        '200':
          description: Access data
          content:
            application/json:
              schema:
                type: object
                required: [serverUrl, username]
                properties:
                  serverUrl: { type: string, examples: ['https://calendar.example.com/dav/'] }
                  username: { type: string, description: The email address of the user }
        '401': { $ref: '#/components/responses/Problem' }
  /caldav-accounts:
    get:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Connected CalDAV accounts
      responses:
        '200':
          description: Accounts with their calendars
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CaldavAccount' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Connect a CalDAV account
      description: |
        The backend finds the calendars of the account (`/.well-known/caldav`, principal, calendar home) and loads them
        once. Loading is protected like external calendars: only `https`, no private networks. `400` with
        `invalidCalendarUrl`, `400` with `caldavAuthFailed` for wrong credentials, `409` with `alreadySubscribed` or
        `tooManyCaldavAccounts` (5 per user), `502` with `externalCalendarUnavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaldavAccountInput' }
      responses:
        '201':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaldavAccount' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /caldav-accounts/{caldavAccountId}:
    parameters:
      - { name: caldavAccountId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Rename an account or store a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                password: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaldavAccount' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Disconnect an account
      description: Removes the account and the copies of its calendars. Nothing is deleted on the other server.
      responses:
        '204': { description: Disconnected }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /caldav-accounts/{caldavAccountId}/sync:
    parameters:
      - { name: caldavAccountId, in: path, required: true, schema: { type: string } }
    post:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Synchronize now
      description: Reloads the list of calendars and their changes. The backend also does this on its own every 15 minutes.
      responses:
        '200':
          description: Synchronized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaldavAccount' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /caldav-calendars/{caldavCalendarId}:
    parameters:
      - { name: caldavCalendarId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Change how a CalDAV calendar is shown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/CalendarName' }
                color: { $ref: '#/components/schemas/EventColor' }
                shown: { type: boolean }
                position: { type: integer, minimum: 0, maximum: 255 }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaldavCalendar' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /caldav-calendars/{caldavCalendarId}/objects:
    parameters:
      - { name: caldavCalendarId, in: path, required: true, schema: { type: string } }
    get:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Events of a CalDAV calendar
      description: The copy of the calendar, one iCalendar object per resource. The component reads them like an import.
      responses:
        '200':
          description: Objects
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CaldavObject' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Create an event on the other server
      description: '`403` with `forbidden` for read-only calendars, `400` with `invalidInput` when `data` is not one valid event.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaldavObjectInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaldavObject' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /caldav-calendars/{caldavCalendarId}/objects/{objectId}:
    parameters:
      - { name: caldavCalendarId, in: path, required: true, schema: { type: string } }
      - { name: objectId, in: path, required: true, schema: { type: string } }
      - { name: If-Match, in: header, required: true, schema: { type: string }, description: '`etag` of the object as loaded' }
    put:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Change an event on the other server
      description: '`412` with `eventChanged` when the event changed there in the meantime; the component then reloads it.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaldavObjectInput' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaldavObject' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [CalDAV accounts]
      x-feature: caldavAccounts
      summary: Delete an event on the other server
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /notifications:
    get:
      tags: [Notifications]
      x-feature: notifications
      summary: Notifications of the user
      description: Newest first. Read notifications are kept for 30 days, unread ones for 90 days.
      parameters:
        - { name: before, in: query, required: false, schema: { type: string }, description: '`id` of the oldest notification already loaded' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [notifications, unread, hasMore]
                properties:
                  notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unread: { type: integer, minimum: 0 }
                  hasMore: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
  /notifications/read:
    post:
      tags: [Notifications]
      x-feature: notifications
      summary: Mark notifications as read
      description: Without `ids` all notifications of the user are marked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 100, items: { type: string } }
      responses:
        '204': { description: Marked }
        '401': { $ref: '#/components/responses/Problem' }
  /notifications/{notificationId}:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Notifications]
      x-feature: notifications
      summary: Remove a notification
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/config:
    get:
      tags: [Tenant]
      x-feature: tenant
      summary: Settings of the tenant
      description: |
        Public, no session. The tenant comes from `X-Calendar-Tenant`. The component loads this once at start when
        `tenant` is set. What this sets wins over the page: built-in defaults, then the settings on the page, then
        this. Fields left out still come from the page. Storage, connection and link settings (`tenant`,
        `storageMode`, `apiBaseUrl`, `routing`) and the `auth` feature are ignored here; a tenant always signs in.
        Answer `404` or an empty object when the tenant has no settings. May be cached for a short time.
      security: []
      responses:
        '200':
          description: Settings, the same fields as the configuration file (see `schema/calendar-config.schema.json`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantConfig' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: The tenant has no settings }
  /holidays:
    get:
      tags: [Holidays]
      x-feature: holidays
      summary: Public holidays of a region
      description: |
        Optional. Only called with `holiday-source="backend"`. Without it, or when this request fails, the component computes holidays itself.
        Return the public holidays (days off) between `from` and `to` inclusive, with names in `lang`.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/ISODate' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/ISODate' } }
        - name: region
          in: query
          required: true
          description: Country, optionally with a subdivision, e.g. `DE`, `DE-NW`, `US-CA`
          schema: { type: string, pattern: '^[A-Z]{2}(-[A-Z0-9]{1,6})?$' }
        - { name: lang, in: query, required: true, schema: { type: string, examples: [de] } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Holidays
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicHoliday' } }
  /preferences:
    get:
      tags: [Preferences]
      x-feature: core
      summary: Preferences of the user
      description: Defaults until something is stored.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Preferences' }
    patch:
      tags: [Preferences]
      x-feature: core
      summary: Change single preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme: { $ref: '#/components/schemas/Theme' }
                defaultView: { $ref: '#/components/schemas/CalendarView' }
                mobileDefaultView: { $ref: '#/components/schemas/CalendarView' }
                locale: { $ref: '#/components/schemas/Locale' }
                timeZone: { $ref: '#/components/schemas/PreferredTimeZone' }
                holidays: { $ref: '#/components/schemas/HolidaySetting' }
                emailInvites: { type: boolean }
                emailChanges: { type: boolean }
                emailReminders: { type: boolean }
                emailChat: { type: boolean }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Preferences' }
        '400': { $ref: '#/components/responses/Problem' }
  /colors:
    get:
      tags: [Preferences]
      x-feature: customColors
      summary: Custom colors in the order they were added
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Colors' }
    post:
      tags: [Preferences]
      x-feature: customColors
      summary: Add a custom color
      description: An existing color is not added twice. `409` with `tooManyColors` from 12 colors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color: { $ref: '#/components/schemas/HexColor' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Colors' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /colors/{color}:
    delete:
      tags: [Preferences]
      x-feature: customColors
      summary: Remove a custom color
      parameters:
        - name: color
          in: path
          required: true
          description: Color without `#`, e.g. `ff8800`
          schema: { type: string, pattern: '^[0-9a-fA-F]{6}$' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/Colors' }
  /categories:
    get:
      tags: [Categories]
      x-feature: categories
      summary: Categories of one or more calendars
      parameters:
        - name: calendarId
          in: query
          required: true
          description: Repeat the parameter for several calendars.
          schema: { type: array, items: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Categories
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '404': { $ref: '#/components/responses/Problem' }
  /calendars/{calendarId}/categories:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Categories]
      x-feature: categories
      summary: Create a category
      description: Needs `manage_calendars`. `409` with `categoryExists` when the name is taken in this calendar (compared without case), `409` with `tooManyCategories` from 30 categories.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryName' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /categories/{categoryId}:
    parameters:
      - { name: categoryId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Categories]
      x-feature: categories
      summary: Rename a category
      description: Needs `manage_calendars`. `409` with `categoryExists` when the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryName' }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Categories]
      x-feature: categories
      summary: Delete a category
      description: Needs `manage_calendars`. Also removes the category from all events.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{eventId}/attachments:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Attachments]
      x-feature: attachments
      summary: Attachments of an event
      description: For every member who can see the event. A series has one set of attachments for all its occurrences; a detached occurrence has its own.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Attachments in upload order
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Attachments]
      x-feature: attachments
      summary: Upload an attachment
      description: |
        Needs `update_any_entry`, or `update_own_entry` for own events. One file per request in the form field `file`.
        At most 10 MB per file (`413` with `attachmentTooLarge`) and 20 files per event (`409` with `tooManyAttachments`).
        Keep only the file name from the upload, never a path.
        `409` with `tenantLimitReached` when the attachment storage of the tenant is full.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/content:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Attachments]
      x-feature: attachments
      summary: Download an attachment
      description: |
        The file as uploaded. Uploaded files are untrusted: always answer with
        `Content-Disposition: attachment; filename*=UTF-8''<name>`, `X-Content-Type-Options: nosniff`
        and `Content-Security-Policy: default-src 'none'; sandbox`, so a browser never shows an uploaded HTML or SVG file as a page of your domain.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Attachments]
      x-feature: attachments
      summary: Delete an attachment
      description: Same rights as uploading. Deleting an event, calendar or team deletes its attachments too.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /calendars/{calendarId}/share:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Sharing]
      x-feature: publicLinks
      summary: Public link of the calendar
      description: Needs `manage_calendars`. There is one link per calendar, shared by everyone who may manage it.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Token or null
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { oneOf: [{ type: string }, { type: 'null' }] } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Sharing]
      x-feature: publicLinks
      summary: Create a new public link
      description: Replaces an existing link, which stops working at once. The token must not be guessable.
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '201':
          description: New token
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string } } }
        '403': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Sharing]
      x-feature: publicLinks
      summary: Stop sharing
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '204': { description: Stopped }
        '403': { $ref: '#/components/responses/Problem' }
  /shared/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Sharing]
      x-feature: publicLinks
      summary: A shared calendar
      description: No session needed. `404` with `shareNotFound` when the token is unknown or sharing was stopped.
      security: []
      responses:
        '200':
          description: Name, color and categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedCalendar' }
        '404': { $ref: '#/components/responses/Problem' }
  /shared/{token}/events:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Sharing]
      x-feature: publicLinks
      summary: Events of a shared calendar
      description: |
        No session needed. Same rules for the range as `GET /events`.
        Leave out everything personal: `attendees` and `reminders` are always empty, `createdBy` is omitted or null.
        Chat messages are never available through a public link.
      security: []
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/ISODate' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/ISODate' } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
    bearerToken:
      type: http
      scheme: bearer
  parameters:
    Tenant:
      name: X-Calendar-Tenant
      in: header
      required: false
      description: Public tenant id. Sent by `tenantDataSource` on every request.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The `version` the client last saw, in quotes (`"3"`). The server answers `412` with `eventChanged`
        when the event has a newer version. Missing or `*` skips the check, for example for "save anyway".
      schema: { type: string, example: '"3"' }
    CalendarId:
      name: calendarId
      in: path
      required: true
      description: '`personal` stands for the own personal calendar.'
      schema: { type: string }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    User:
      description: User
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    Event:
      description: Event
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CalendarEvent' }
    CalendarSummary:
      description: Calendar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CalendarSummary' }
    CalendarSummaries:
      description: Calendars
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/CalendarSummary' } }
    Preferences:
      description: Preferences
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Preferences' }
    RecoveryCodes:
      description: Recovery codes, shown once
      content:
        application/json:
          schema:
            type: object
            required: [recoveryCodes]
            properties:
              recoveryCodes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
    Colors:
      description: Custom colors
      content:
        application/json:
          schema: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/HexColor' } }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable reason. The component translates the codes it knows.
          examples: [invalidCredentials, emailTaken, forbidden, lastOwner, tooManyColors, invalidInput, unknownTenant, originNotAllowed, invalidUserToken]
        message:
          type: string
          description: English description, shown when the component does not know the code.
    User:
      type: object
      required: [id, email, name, emailVerified]
      properties:
        id: { type: string }
        email: { $ref: '#/components/schemas/Email' }
        name: { $ref: '#/components/schemas/PersonName' }
        emailVerified: { type: boolean }
        twoFactorEnabled: { type: boolean, description: Only sent when the backend offers `twoFactor` }
        hasPassword: { type: boolean, description: '`false` for accounts that only sign in through the host page' }
    TwoFactorState:
      type: object
      required: [enabled, recoveryCodesLeft, available]
      properties:
        enabled: { type: boolean }
        recoveryCodesLeft: { type: integer, minimum: 0, maximum: 10 }
        available: { type: boolean, description: '`false` for accounts without a password' }
    Session:
      type: object
      required: [id, current, createdAt, lastSeenAt, expiresAt, userAgent, ipAddress]
      properties:
        id: { type: string }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        userAgent: { oneOf: [{ type: string }, { type: 'null' }] }
        ipAddress: { oneOf: [{ type: string }, { type: 'null' }], description: 'Shortened, for example `203.0.113.x`' }
    HistoryChange:
      type: object
      required: [field, old, new]
      properties:
        field:
          type: string
          enum: [title, location, description, start, end, allDay, timeZone, color, calendar, recurrence, attendees, links, categories]
        old: { oneOf: [{ type: string }, { type: 'null' }], description: '`null` for attendees, links, categories and recurrence' }
        new: { oneOf: [{ type: string }, { type: 'null' }] }
    HistoryEntry:
      type: object
      required: [id, action, changedAt, changedBy, changes]
      properties:
        id: { type: string }
        action: { type: string, enum: [created, updated, moved, deleted, restored] }
        changedAt: { type: string, format: date-time }
        changedBy:
          description: null when the account was deleted or the change came from an email link
          oneOf: [{ type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }, { type: 'null' }]
        changes: { type: array, items: { $ref: '#/components/schemas/HistoryChange' } }
    AppPassword:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
    CaldavAccountInput:
      type: object
      required: [name, serverUrl, username, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        serverUrl: { type: string, maxLength: 2000, examples: ['https://cloud.example.com/remote.php/dav'] }
        username: { type: string, minLength: 1, maxLength: 255 }
        password: { type: string, minLength: 1, maxLength: 500 }
    CaldavCalendar:
      type: object
      required: [id, name, color, shown, readOnly, position, syncedAt]
      properties:
        id: { type: string }
        name: { type: string }
        color: { $ref: '#/components/schemas/EventColor' }
        shown: { type: boolean }
        readOnly: { type: boolean }
        position: { type: integer }
        syncedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
    CaldavAccount:
      type: object
      required: [id, name, serverHost, username, syncedAt, syncError, calendars]
      properties:
        id: { type: string }
        name: { type: string }
        serverHost: { type: string }
        username: { type: string }
        syncedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        syncError: { oneOf: [{ type: string }, { type: 'null' }], description: 'Error code of the last synchronization, for example `caldavAuthFailed`' }
        calendars: { type: array, items: { $ref: '#/components/schemas/CaldavCalendar' } }
    CaldavObjectInput:
      type: object
      required: [data]
      properties:
        data: { type: string, maxLength: 1048576, description: 'iCalendar with one event (`UID`), its repetition and exceptions' }
    CaldavObject:
      type: object
      required: [id, etag, data]
      properties:
        id: { type: string }
        etag: { type: string }
        data: { type: string }
    ExternalCalendarInput:
      type: object
      required: [name, url]
      properties:
        name: { $ref: '#/components/schemas/CalendarName' }
        url: { type: string, maxLength: 2000, examples: ['https://example.com/holidays.ics'] }
        color: { $ref: '#/components/schemas/EventColor' }
    ExternalCalendar:
      type: object
      required: [id, name, color, shown, position, urlHost, fetchedAt, error]
      properties:
        id: { type: string }
        name: { type: string }
        color: { $ref: '#/components/schemas/EventColor' }
        shown: { type: boolean }
        position: { type: integer }
        urlHost: { type: string, description: 'Only the host of the address; the full address may contain a secret and is never sent back' }
        fetchedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        error: { oneOf: [{ type: string }, { type: 'null' }], description: 'Error code of the last load, for example `externalCalendarUnavailable`' }
    Notification:
      type: object
      required: [id, kind, actor, event, team, invitationId, createdAt, readAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [teamInvitation, eventInvitation, eventChanged, eventCanceled, attendeeResponse, chatMessage, reminder] }
        actor:
          oneOf: [{ type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }, { type: 'null' }]
        event:
          oneOf:
            - type: object
              required: [id, calendarId, title, startDate, occurrenceDate]
              properties:
                id: { type: string }
                calendarId: { type: string }
                title: { type: string }
                startDate: { $ref: '#/components/schemas/ISODate' }
                occurrenceDate: { oneOf: [{ $ref: '#/components/schemas/ISODate' }, { type: 'null' }] }
            - { type: 'null' }
        team:
          oneOf: [{ type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }, { type: 'null' }]
        invitationId: { oneOf: [{ type: string }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        readAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
    Email:
      type: string
      format: email
      maxLength: 254
    PersonName:
      type: string
      minLength: 1
      maxLength: 80
    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
    ISODate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
    Time:
      type: string
      pattern: '^\d{2}:\d{2}$'
    HexColor:
      type: string
      pattern: '^#[0-9a-f]{6}$'
    EventColor:
      description: A preset name or a custom color
      anyOf:
        - { type: string, enum: [blue, red, green, yellow] }
        - { $ref: '#/components/schemas/HexColor' }
    Recurrence:
      type: object
      required: [frequency, interval, weekdays, monthlyMode, until, count]
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1, maximum: 99 }
        weekdays:
          type: array
          description: 0 = Monday … 6 = Sunday, at least one for weekly
          items: { type: integer, minimum: 0, maximum: 6 }
        monthlyMode: { type: string, enum: [dayOfMonth, weekdayOfMonth, lastWeekdayOfMonth] }
        until: { oneOf: [{ $ref: '#/components/schemas/ISODate' }, { type: 'null' }] }
        count: { oneOf: [{ type: integer, minimum: 1, maximum: 999 }, { type: 'null' }] }
        rule:
          oneOf:
            - type: string
              maxLength: 500
              pattern: '^FREQ=[A-Z]+(;[A-Z-]+=[A-Z0-9,+-]+)*$'
            - type: 'null'
          default: null
          description: |
            A rule from another program that the fields above cannot describe, as an RFC 5545 `RRULE` value without
            `UNTIL` and `COUNT` (the end comes from `until` or `count`). When set, it decides the occurrences and the
            other fields are only an approximation for programs that do not know it. Store and return it unchanged.
        dates:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/ISODate' }
          description: Additional occurrences (`RDATE`) after the start, independent of `until` and `count`.
    EventInput:
      type: object
      required: [title, startDate, start, endDate, end, description, color, recurrence, excludedDates, seriesId, originalDate]
      properties:
        uid:
          type: string
          maxLength: 255
          description: Stable id for iCalendar exchange. Kept when importing again; the backend creates one if missing. Detached occurrences share the uid of their series.
        title: { type: string, minLength: 1, maxLength: 100 }
        location: { type: string, maxLength: 200, default: '' }
        links:
          type: array
          maxItems: 10
          default: []
          items: { $ref: '#/components/schemas/EventLink' }
          description: Website and other links. Only http and https addresses are accepted.
        categoryIds:
          type: array
          maxItems: 5
          default: []
          items: { type: string }
          description: Categories of the event. Every id must belong to the calendar of the event, otherwise `400`.
        startDate: { $ref: '#/components/schemas/ISODate' }
        start: { $ref: '#/components/schemas/Time' }
        endDate: { $ref: '#/components/schemas/ISODate' }
        end: { $ref: '#/components/schemas/Time' }
        allDay:
          type: boolean
          default: false
          description: All-day events cover startDate to endDate inclusive. start and end are '00:00'.
        timeZone:
          description: IANA zone of start and end, e.g. 'Europe/Berlin'. null keeps the same local time in every zone and is always null for all-day events.
          oneOf: [{ type: string }, { type: 'null' }]
          default: null
        description: { type: string, maxLength: 2000 }
        color: { $ref: '#/components/schemas/EventColor' }
        recurrence: { oneOf: [{ $ref: '#/components/schemas/Recurrence' }, { type: 'null' }] }
        excludedDates: { type: array, items: { $ref: '#/components/schemas/ISODate' } }
        seriesId:
          description: For a detached occurrence, the series it was taken from
          oneOf: [{ type: string }, { type: 'null' }]
        originalDate:
          description: For a detached occurrence, its original date in the series
          oneOf: [{ $ref: '#/components/schemas/ISODate' }, { type: 'null' }]
        reminders:
          type: array
          maxItems: 5
          default: []
          items: { type: integer, minimum: 0, maximum: 40320 }
          description: |
            Minutes before the start (for all-day events before 00:00 of the first day) at which the signed-in user wants to be reminded.
            Personal: store them per user and return only the caller's own reminders. Changing them never affects other members.
        attendees:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/Attendee' }
    Category:
      type: object
      required: [id, calendarId, name]
      properties:
        id: { type: string }
        calendarId: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
    CategoryName:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
    SharedCalendar:
      type: object
      required: [id, name, color, categories]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    EventLink:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2000, pattern: '^https?://' }
        label: { type: string, maxLength: 100, default: '' }
    AttendeeStatus:
      type: string
      enum: [needsAction, accepted, tentative, declined]
    Attendee:
      type: object
      required: [email, name, status]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        status: { $ref: '#/components/schemas/AttendeeStatus' }
    CalendarEvent:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [id, calendarId, createdBy, createdAt, updatedAt, version]
          properties:
            id: { type: string }
            version:
              type: integer
              minimum: 1
              description: |
                Starts at 1 and goes up on every change by a person (PUT, attendee response, removed category).
                Own reminders do not change it. Read-only, ignored on input.
            calendarId: { type: string }
            createdBy: { oneOf: [{ type: string }, { type: 'null' }] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            attachmentCount:
              type: integer
              minimum: 0
              default: 0
              description: Number of attachments of this event. Read-only, ignored on input. 0 in public links.
    AccountExport:
      type: object
      required: [format, version, exportedAt, user]
      properties:
        format: { type: string, const: calendar-account-export }
        version: { type: integer, const: 1 }
        exportedAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        preferences: { type: object }
        colors: { type: array, items: { type: string } }
        memberships: { type: array, items: { type: object } }
        calendars: { type: array, items: { type: object } }
        categories: { type: array, items: { type: object } }
        events: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
        trash: { type: array, items: { type: object } }
        reminders: { type: array, items: { type: object } }
        responses: { type: array, items: { type: object } }
        chatMessages: { type: array, items: { type: object } }
        attachments: { type: array, items: { type: object } }
      additionalProperties: true
    TrashedEvent:
      type: object
      required: [event, deletedAt, deletedBy, deletedByName, expiresAt, detachedCount]
      properties:
        event: { $ref: '#/components/schemas/CalendarEvent' }
        deletedAt: { type: string, format: date-time }
        deletedBy: { oneOf: [{ type: string }, { type: 'null' }] }
        deletedByName: { oneOf: [{ type: string }, { type: 'null' }] }
        expiresAt:
          type: string
          format: date-time
          description: When the event is deleted for good, 30 days after `deletedAt`.
        detachedCount:
          type: integer
          minimum: 0
          description: Detached events that were deleted together with this series and come back with it.
    Attachment:
      type: object
      required: [id, eventId, name, type, size, createdAt, uploadedBy]
      properties:
        id: { type: string }
        eventId: { type: string }
        name: { type: string, maxLength: 200, description: 'File name without any path' }
        type: { type: string, description: 'Media type as uploaded, application/octet-stream when unknown' }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        createdAt: { type: string, format: date-time }
        uploadedBy:
          oneOf:
            - type: object
              required: [id, name]
              properties: { id: { type: string }, name: { type: string } }
            - type: 'null'
    TeamRole:
      type: string
      enum: [owner, admin, manager, editor, member, contributor, viewer]
    InvitableRole:
      type: string
      enum: [admin, manager, editor, member, contributor, viewer]
    Permission:
      type: string
      enum:
        - read_calendar
        - manage_calendars
        - create_entry
        - update_own_entry
        - update_any_entry
        - delete_own_entry
        - delete_any_entry
        - invite_members
        - manage_members
        - manage_team
        - delete_team
    CalendarName:
      type: string
      minLength: 1
      maxLength: 80
    Description:
      type: string
      maxLength: 500
    CalendarSummary:
      type: object
      required: [id, teamId, name, color, kind, teamName, description, role, showInPersonal, permissions]
      properties:
        id: { type: string }
        teamId: { type: string }
        name: { type: string }
        color: { $ref: '#/components/schemas/EventColor' }
        kind: { type: string, enum: [personal, team] }
        teamName: { oneOf: [{ type: string }, { type: 'null' }] }
        description: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        showInPersonal: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    TeamMember:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        joinedAt: { type: string, format: date-time }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/InvitableRole' }
    PendingInvitation:
      type: object
      required: [id, teamId, teamName, description, role, invitedBy, expiresAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        teamName: { type: string }
        description: { type: string }
        role: { $ref: '#/components/schemas/InvitableRole' }
        invitedBy:
          description: Name of the inviting person
          oneOf: [{ type: string }, { type: 'null' }]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    TeamInvitation:
      allOf:
        - $ref: '#/components/schemas/PendingInvitation'
        - type: object
          required: [email]
          properties:
            email: { $ref: '#/components/schemas/Email' }
    Theme:
      type: string
      enum: [system, light, dark]
    CalendarView:
      type: string
      enum: [day, week, month, year, agenda]
    Locale:
      type: string
      description: '`auto` or a BCP 47 language tag such as `en-US`, `en-GB`, `de-DE`'
      maxLength: 35
      pattern: '^(auto|[a-z]{2,3}(-[A-Za-z0-9]{2,8})*)$'
    HolidaySetting:
      type: string
      default: auto
      description: '`auto` (region given by the host, otherwise from the language), `off`, or a region such as `DE-NW`.'
      pattern: '^(auto|off|[A-Z]{2}(-[A-Z0-9]{1,6})?)$'
    ChatMessage:
      type: object
      required: [id, calendarId, eventId, occurrenceDate, author, text, createdAt, editedAt]
      properties:
        id: { type: string }
        calendarId: { type: string }
        eventId: { type: string }
        occurrenceDate: { oneOf: [{ $ref: '#/components/schemas/ISODate' }, { type: 'null' }] }
        author:
          description: null when the account was deleted
          oneOf: [{ type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }, { type: 'null' }]
        text: { type: string }
        createdAt: { type: string, format: date-time }
        editedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
    ChatPage:
      type: object
      required: [messages, hasMore]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        hasMore: { type: boolean }
    ChatUnread:
      type: object
      required: [eventId, occurrenceDate, count]
      properties:
        eventId: { type: string }
        occurrenceDate: { oneOf: [{ $ref: '#/components/schemas/ISODate' }, { type: 'null' }] }
        count: { type: integer, minimum: 1 }
    EventResponse:
      type: object
      required: [title, location, startDate, start, endDate, end, allDay, timeZone, recurring, status]
      properties:
        title: { type: string }
        location: { type: string }
        startDate: { $ref: '#/components/schemas/ISODate' }
        start: { $ref: '#/components/schemas/Time' }
        endDate: { $ref: '#/components/schemas/ISODate' }
        end: { $ref: '#/components/schemas/Time' }
        allDay: { type: boolean }
        timeZone: { oneOf: [{ type: string }, { type: 'null' }] }
        recurring: { type: boolean }
        status: { $ref: '#/components/schemas/AttendeeStatus' }
    PublicHoliday:
      type: object
      required: [date, name]
      properties:
        date: { $ref: '#/components/schemas/ISODate' }
        name: { type: string }
    PreferredTimeZone:
      type: string
      default: auto
      description: '`auto` (zone given by the host, otherwise the system zone) or an IANA zone such as `Europe/Berlin`. Events are shown in this zone.'
    TenantConfig:
      type: object
      description: |
        Subset of the configuration file. A feature turned off here must also be refused by the backend with `403`
        `featureDisabled`, the component only hides it.
      properties:
        features:
          type: object
          additionalProperties: { type: boolean }
          examples: [{ registration: false, attachments: true, publicLinks: false }]
        views: { type: array, items: { $ref: '#/components/schemas/CalendarView' } }
        initialView: { $ref: '#/components/schemas/CalendarView' }
        locale: { type: string, examples: ['de-DE'] }
        theme: { type: string, enum: [light, dark] }
        timeZone: { type: string }
        holidays: { type: string }
        mapUrl: { type: string }
        readOnly: { type: boolean }
        appearance:
          type: object
          properties:
            accentColor: { type: string }
            fontFamily: { type: string }
            radius: { type: number, minimum: 0, maximum: 24 }
            density: { type: string, enum: [comfortable, compact] }
        messages: { type: object, description: Text overrides per language }
    Preferences:
      type: object
      required: [theme, defaultView, mobileDefaultView, locale, timeZone, holidays, emailInvites, emailChanges, emailReminders, emailChat]
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        defaultView: { $ref: '#/components/schemas/CalendarView' }
        mobileDefaultView: { $ref: '#/components/schemas/CalendarView' }
        locale: { $ref: '#/components/schemas/Locale' }
        timeZone: { $ref: '#/components/schemas/PreferredTimeZone' }
        holidays: { $ref: '#/components/schemas/HolidaySetting' }
        emailInvites: { type: boolean, default: true, description: Email when someone invites the user to an event }
        emailChanges: { type: boolean, default: true, description: Email when an event the user is invited to changes or is cancelled }
        emailReminders: { type: boolean, default: false, description: Emails at the user's own reminder times }
        emailChat: { type: boolean, default: true, description: Email about new chat messages of events the user is invited to }
